<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>世界の終活者</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="top">
    <div><b id="date">2020年</b> <span id="phase" class="tag"></span></div>
    <div id="pop" class="pop"></div>
  </div>
  <div class="speed" id="speed">
    <button data-s="0">⏸</button><button data-s="1">▶</button><button data-s="2">⏩</button><button data-s="3">⏭</button><button data-s="4">⏭⏭</button>
    <span id="spdlabel"></span>
  </div>
</header>
<nav id="tabs">
  <button data-t="map" class="on">地図</button><button data-t="status">状況</button><button data-t="policy">方針</button><button data-t="log">年表</button><button data-t="sys">記録</button>
</nav>
<main>
  <section id="map" class="tab on">
    <div class="row"><select id="layer"><option value="pop">人口</option><option value="happy">幸福度</option><option value="unrest">社会不安</option><option value="fac">稼働施設</option></select>
      <button id="zin">＋</button><button id="zout">－</button><button id="zreset">全体</button></div>
    <div id="mapbox"><svg id="svg" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet"></svg></div>
    <div id="legend" class="small"></div>
    <div id="card" class="card"><span class="dim">国をタップすると詳細が表示されます</span></div>
  </section>
  <section id="status" class="tab"></section>
  <section id="policy" class="tab"></section>
  <section id="log" class="tab"></section>
  <section id="sys" class="tab"></section>
</main>
<div id="modal" class="modal" hidden><div class="box" id="mbox"></div></div>
<script type="module" src="js/ui.js"></script>
</body>
</html>
