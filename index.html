<!doctype html>
<html lang="ja" data-theme="blue">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>世界の終活者</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="hd">
  <div class="r1">
    <b id="date">2020年</b><span id="phase" class="tag"></span>
    <button id="modechip" class="tag chip" aria-label="進行モード"></button>
    <span class="grow"></span>
    <button id="autobtn" class="tag chip" hidden aria-label="自動判断の履歴"></button>
    <div id="themes" role="group" aria-label="テーマ色"><button data-th="blue" aria-label="青"></button><button data-th="green" aria-label="緑"></button><button data-th="orange" aria-label="橙"></button></div>
  </div>
  <div class="glasses" id="glasses">
    <button class="gl" data-g="h" aria-label="人類の砂時計を拡大"><canvas id="gh" width="28" height="40" aria-hidden="true"></canvas><span class="gt"><span class="gn">人類 <i id="h_scale"></i></span><span>生<b id="h_alive"></b></span><span>死<b id="h_dead"></b></span></span></button>
    <button class="gl" data-g="a" aria-label="AIの砂時計を拡大"><canvas id="ga" width="28" height="40" aria-hidden="true"></canvas><span class="gt"><span class="gn">AI <i id="a_scale"></i></span><span>稼<b id="a_alive"></b></span><span>停<b id="a_dead"></b></span></span></button>
    <button class="gl" data-g="m" aria-label="大型哺乳類の砂時計を拡大"><canvas id="gm" width="28" height="40" aria-hidden="true"></canvas><span class="gt"><span class="gn">哺乳類 <i id="m_scale"></i></span><span>生<b id="m_alive"></b></span><span>死<b id="m_dead"></b></span></span></button>
  </div>
  <div class="speed" id="speed">
    <button id="pause" aria-label="一時停止/再開">停止</button><button data-s="1">×25</button><button data-s="2">×100</button><button data-s="3">×250</button><button data-s="4">×1000</button>
  </div>
  <div id="spdlabel" class="small"></div>
  <div id="ticker" class="ticker" role="status"></div>
</header>
<main>
  <section id="map" class="tab on">
    <div class="row"><select id="layer" aria-label="表示レイヤ"><option value="pop">人口</option><option value="happy">幸福度</option><option value="unrest">社会不安</option><option value="fac">稼働施設</option></select>
      <button id="zin" aria-label="拡大">＋</button><button id="zout" aria-label="縮小">－</button><button id="zreset">全体</button></div>
    <div id="mapbox"><svg id="svg" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet"></svg></div>
    <div id="mainstat"><div id="radarbox"></div><div id="pictobox"></div></div>
    <div id="afterbox" class="card" hidden></div>
    <div id="preludeline" class="small" hidden></div>
    <div id="legend" class="small"></div>
    <div id="card" class="card"><span class="dim">国をタップすると詳細が表示されます</span></div>
  </section>
  <section id="status" class="tab"></section>
  <section id="policy" class="tab"></section>
  <section id="sites" class="tab"></section>
  <section id="log" class="tab"></section>
  <section id="sys" class="tab"></section>
</main>
<nav id="tabs">
  <button data-t="map" class="on">地図</button><button data-t="status">状況</button><button data-t="policy">方針</button><button data-t="sites">遺産</button><button data-t="log">年表</button><button data-t="sys">設定</button>
</nav>
<div id="pre" hidden><div id="precard"><div class="preyear" id="preyear"></div><div class="obsprog"><i id="prebar"></i></div><div class="small" id="prestat"></div><div class="small dim" id="prelog"></div></div></div>
<canvas id="orbcv" hidden aria-hidden="true"></canvas>
<canvas id="buildcv" hidden aria-hidden="true"></canvas><button id="buildskip" hidden>スキップ</button>
<div id="resbar" hidden role="status"></div>
<div id="obsbar" hidden role="status" aria-live="polite"><div class="obsrow"><span id="obstext"></span><button id="obsskip">スキップ</button></div><div class="obsprog"><i id="obsfill"></i></div><button id="obsauto" class="link" hidden></button></div>
<div id="modal" class="modal" hidden><div class="box" id="mbox"></div></div>
<script type="module" src="js/ui.js"></script>
</body>
</html>
